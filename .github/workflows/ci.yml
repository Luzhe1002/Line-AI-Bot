name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend test dependencies
        run: npm ci

      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome

      - name: Verify backend, frontend, and Compose configuration
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Build production container stage
        run: docker build --target package --tag line-ai-bot:ci .
