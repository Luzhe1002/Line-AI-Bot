services:
  - type: web
    name: line-ai-bot
    runtime: docker
    plan: free
    region: singapore
    branch: agent/merchant-portal-line-reliability
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /portal/
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: line-ai-bot-db
          property: connectionString
      - key: APP_ENVIRONMENT
        value: production
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: APP_PLATFORM_ADMIN_API_KEY
        generateValue: true
      - key: APP_SESSION_COOKIE_SECURE
        value: "true"
      - key: APP_AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_LINE_API_ENABLED
        value: "true"
      - key: APP_PUBLIC_BASE_URL
        value: https://line-ai-bot-mj1n.onrender.com

databases:
  - name: line-ai-bot-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: line_ai_bot
    user: line_ai_bot
    ipAllowList: []
